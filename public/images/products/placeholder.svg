<svg width="400" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#F3F1E8"/>
  
  <!-- Icon - Package Box -->
  <g transform="translate(150, 120)">
    <!-- Box -->
    <rect x="0" y="20" width="100" height="80" fill="#F7BC0F" stroke="#D66322" stroke-width="3" rx="5"/>
    <polygon points="0,20 50,0 150,0 100,20" fill="#FFCD4D" stroke="#D66322" stroke-width="3"/>
    <polygon points="100,20 150,0 150,80 100,100" fill="#E5A50A" stroke="#D66322" stroke-width="3"/>
    
    <!-- Lines on box -->
    <line x1="50" y1="20" x2="50" y2="100" stroke="#D66322" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="0" y1="60" x2="100" y2="60" stroke="#D66322" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="20" fill="#666" text-anchor="middle" font-weight="bold">
    Product Image
  </text>
  <text x="200" y="285" font-family="Arial, sans-serif" font-size="16" fill="#999" text-anchor="middle">
    Add image to display
  </text>
</svg>